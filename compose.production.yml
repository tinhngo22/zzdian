# Standalone production stack; do not merge with development docker-compose.yml.
x-api-environment: &api-environment
  DATABASE_URL: postgresql://hanzi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/hanzi
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  CORS_ORIGINS: ""

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanzi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: hanzi
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  migrate:
    build: ./backend
    environment: *api-environment
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
    logging: *logging

  api:
    build: ./backend
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database, application]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging: *logging

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [application, edge]
    healthcheck:
      test: [CMD, wget, -q, -O-, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your public hostname}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  database:
    internal: true
  application:
    internal: true
  edge:
