worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 2m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only Caddy can reach this service; Caddy overwrites the forwarded address.
    map $http_x_forwarded_for $client_key {
        "" $remote_addr;
        default $http_x_forwarded_for;
    }
    limit_req_zone $client_key zone=login:10m rate=5r/m;
    limit_req_zone $client_key zone=api:10m rate=20r/s;
    limit_req_status 429;
    log_format safe '$client_key [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout safe;

    resolver 127.0.0.11 valid=10s;
    upstream api_backend {
        zone api_backend 64k;
        server api:8000 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        include /etc/nginx/security_headers.conf;

        location = /healthz { access_log off; return 200 'ok'; }
        location = /api { return 308 /api/; }
        location = /api/auth/login/ { return 308 /api/auth/login; }
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api_backend/auth/login;
            include /etc/nginx/proxy_params.conf;
        }
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api_backend/;
            include /etc/nginx/proxy_params.conf;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
